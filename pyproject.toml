[project]
name = "second-brain-mcp"
version = "0.1.0"
description = "An MCP server that turns an Obsidian vault into one shared, people-first second brain for every Claude session."
readme = "README.md"
authors = [
    { name = "Lior Solomon" }
]
requires-python = ">=3.12"
license = "MIT"
keywords = ["mcp", "obsidian", "second-brain", "claude", "personal-crm"]
dependencies = [
    "boto3>=1.43.114",
    "fastmcp>=4.1.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.16.1",
    "python-frontmatter>=1.3.0",
]

[project.scripts]
second-brain-mcp = "second_brain.server:main"

[project.urls]
Repository = "https://github.com/liorsolomon/second-brain-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "moto>=5.2.4",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/second_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
