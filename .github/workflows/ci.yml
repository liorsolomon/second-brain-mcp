name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t second-brain-mcp .
      - name: Runs as non-root with a root-owned volume
        run: |
          mkdir data && sudo chown root:root data && sudo chmod 755 data
          out=$(docker run --rm -v "$PWD/data:/data" -e SB_OAUTH_STORAGE_DIR=/data/oauth second-brain-mcp \
            sh -c 'echo "uid=$(id -u)"; stat -c "owner=%U mode=%a" /data/oauth; touch /data/oauth/probe && echo storage=writable; touch /app/probe 2>/dev/null && echo app=writable || echo app=readonly')
          echo "$out"
          echo "$out" | grep -qx "uid=10001"
          echo "$out" | grep -qx "owner=brain mode=700"
          echo "$out" | grep -qx "storage=writable"
          echo "$out" | grep -qx "app=readonly"
